services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: local-todo-password
      POSTGRES_DB: todo
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d todo"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      PROJECT_NAME: Kubernetes Todo Lab
      BACKEND_CORS_ORIGINS: '["http://localhost:8081"]'
      POSTGRES_SERVER: database
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: local-todo-password
      POSTGRES_DB: todo
    command: ["sh", "-c", "/app/prestart.sh && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build: ./frontend
    environment:
      REACT_APP_BACKEND_BASE_URI: /api/items
    ports:
      - "8081:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
